# Environment for the "tf-keras" backend.
#   conda env create -f environments/bm_tf_env.yml
name: bm_tf_env

channels:
  - defaults

dependencies:
  - python=3.12
  - pip
  - pip:
      # Not [and-cuda]: it requires NCCL >= 2.27.7, while torch 2.10's CUDA stack, shared by
      # the three environments, has 2.27.5. The libraries it would add are pinned below
      - tensorflow==2.21.0
      - nvidia-cublas-cu12==12.8.4.1
      - nvidia-cuda-cupti-cu12==12.8.90
      - nvidia-cuda-nvcc-cu12==12.8.93
      - nvidia-cuda-nvrtc-cu12==12.8.93
      - nvidia-cuda-runtime-cu12==12.8.90
      - nvidia-cudnn-cu12==9.10.2.21
      - nvidia-cufft-cu12==11.3.3.83
      - nvidia-curand-cu12==10.3.9.90
      - nvidia-cusolver-cu12==11.7.3.90
      - nvidia-cusparse-cu12==12.5.8.93
      - nvidia-nccl-cu12==2.27.5
      - nvidia-nvjitlink-cu12==12.8.93
      - keras==3.15.1
      - numpy==2.5.2
      - pandas==3.0.5
      - scikit-learn==1.9.0
      - nvidia-ml-py==13.610.43
      - codecarbon==3.3.0
      # TF accepts any protobuf < 8: pinned to the version of bm_jax_env
      - protobuf==7.36.0
